# Render blueprint for the Next.js front end (Website Plan 12.4.1: paid instance, Frankfurt).
# Runs from the bundled catalogue until WP_URL is set; then it reads WordPress live.
services:
  - type: web
    name: empire-site
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: site
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: SITE_URL
        sync: false # https://<the real domain>, no trailing slash
      - key: REVALIDATE_SECRET
        generateValue: true
      - key: INDEXNOW_KEY
        sync: false # leave empty until the domain is live
      - key: WP_URL
        sync: false # leave empty to use the bundled catalogue
